# 模型禁用与排序 bundle 的 patch 层。
#
# 一条 insert：Host 侧插件行 `model-guard`（id 即 settings 命名空间，
# 设置页通过 `configForms.get("model-guard")` 读写下列字段）。
#
# disabledModels    形如 "provider/model"，禁用单个模型
# disabledProviders provider id，禁用整个服务商（其全部模型一并隐藏）
# providerOrder     服务商的显示顺序（provider id 列表）；未列出的排在后面
# modelOrder        模型的显示顺序（"provider/model" 列表）；未列出的排在所属服务商内已列出项之后
# providerSort      未手动排序时服务商的排列策略：natural | name
# modelSort         未手动排序时模型的排列策略：natural | name
- insert:
    - id: model-guard
      name: '@local/dsh-model-guard'
      config:
        disabledModels: []
        disabledProviders: []
        providerOrder: []
        modelOrder: []
        providerSort: natural
        modelSort: natural
        collapsePickerGroups: true

# 侧边栏「搜索全部对话」：打开会话全文索引。
#
# 上游 `@deepseek-ai/dsh-base` / `@deepseek-ai/dsh-web-app` 把 session-query-sqlite
# 挂成 `openAt: never`（只保留精确读取/标题/血缘，Web 侧边栏搜索只能匹配标题与
# 工作区名）。本 bundle 排在 dsh-web-app 之后，用这条 id 覆盖把索引打开：
#
#   openAt: first-search  首次搜索时构建/增量同步 SQLite 全文索引（不在启动期打开，
#                         Node 启动保持安静）；索引就绪后侧边栏搜索框命中消息正文，
#                         返回会话标题 + 正文片段。
#   path                 持久化派生索引，避免每次进程重启重建；目录随 DSH_HOME。
#   journalMode: wal      索引库是读多写少的派生数据，WAL 降低读写互斥。
#
# 关掉本功能：把 openAt 改回 never（或删掉这条 patch 条目）。
- id: session-query-sqlite
  config:
    path: !!js dshHomePath('cache/session-search.sqlite')
    openAt: first-search
    journalMode: wal
